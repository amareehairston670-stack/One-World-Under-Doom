<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Latverian Registry — One World Under Doom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --void:#07090a;
  --void-2:#0d1210;
  --panel:#0f1713;
  --panel-2:#131e19;
  --green-deep:#0f2e22;
  --green-mid:#1a4a35;
  --green-line:#3a8562;
  --green-line-dim:#2a5c44;
  --gold:#c9a13a;
  --gold-bright:#e6c765;
  --scarlet:#8f2a2a;
  --scarlet-bright:#c94a3f;
  --parchment:#e9e0c7;
  --parchment-dim:#c9bf9e;
  --steel:#93a29a;
  --ink:#0b0d0a;
  --font-display:'Cinzel',serif;
  --font-body:'Spectral',serif;
  --font-mono:'Space Mono',monospace;
  --radius:2px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--void);
  color:var(--parchment);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 1200px 700px at 50% -10%, rgba(58,133,98,0.14), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; letter-spacing:0.02em; margin:0; color:var(--parchment);}
a{color:var(--gold-bright);}
p{margin:0 0 1em 0;}
::selection{background:var(--scarlet); color:var(--parchment);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:var(--void);}
::-webkit-scrollbar-thumb{background:var(--green-line-dim); border-radius:6px;}
button, input, textarea, select{font-family:inherit; font-size:1rem; color:inherit;}
img{max-width:100%; display:block;}
:focus-visible{outline:2px solid var(--gold-bright); outline-offset:2px;}

.wrap{max-width:1180px; margin:0 auto; padding:0 20px;}
.eyebrow{font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold); margin:0 0 10px 0;}

/* ============ SEAL / BRAND ============ */
.seal{width:38px; height:38px; position:relative; flex-shrink:0;}
.seal .ring{position:absolute; inset:0; border:2px solid var(--gold); border-radius:50%;}
.seal .ring2{position:absolute; inset:5px; border:1px solid var(--gold-bright); border-radius:50%; opacity:0.6;}
.seal .mark{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.seal .mark svg{width:18px; height:18px;}

/* ============ HEADER / NAV ============ */
.site-header{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg, rgba(7,9,10,0.97), rgba(7,9,10,0.9));
  border-bottom:1px solid var(--green-line-dim);
  backdrop-filter:blur(6px);
}
.nav-row{display:flex; align-items:center; gap:20px; padding:12px 0; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:12px; text-decoration:none; cursor:pointer; margin-right:auto;}
.brand-text{display:flex; flex-direction:column; line-height:1.15;}
.brand-title{font-family:var(--font-display); font-size:1.05rem; letter-spacing:0.08em; color:var(--parchment);}
.brand-sub{font-family:var(--font-mono); font-size:0.62rem; letter-spacing:0.1em; color:var(--steel); text-transform:uppercase;}
.nav-links{display:flex; gap:4px; flex-wrap:wrap;}
.nav-link{
  background:none; border:1px solid transparent; color:var(--parchment-dim);
  font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase;
  padding:8px 12px; cursor:pointer; border-radius:var(--radius); transition:all .15s;
}
.nav-link:hover{color:var(--gold-bright); border-color:var(--green-line-dim);}
.nav-link.active{color:var(--void); background:var(--gold); border-color:var(--gold);}
.nav-actions{display:flex; align-items:center; gap:8px;}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  font-family:var(--font-mono); font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase;
  padding:11px 18px; border-radius:var(--radius); cursor:pointer; border:1px solid var(--green-line);
  background:transparent; color:var(--parchment); text-decoration:none; transition:all .15s; white-space:nowrap;
}
.btn:hover{border-color:var(--gold); color:var(--gold-bright); transform:translateY(-1px);}
.btn-primary{background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:700;}
.btn-primary:hover{background:var(--gold-bright); border-color:var(--gold-bright); color:var(--ink);}
.btn-scarlet{background:var(--scarlet); border-color:var(--scarlet); color:var(--parchment);}
.btn-scarlet:hover{background:var(--scarlet-bright); border-color:var(--scarlet-bright); color:#fff;}
.btn-sm{padding:7px 12px; font-size:0.68rem;}
.btn-block{width:100%;}
.btn[disabled]{opacity:0.35; cursor:not-allowed; transform:none !important;}
.btn-ghost{border-color:var(--green-line-dim); color:var(--steel);}

/* ============ HERO ============ */
.hero{
  position:relative; min-height:78vh; display:flex; align-items:flex-end;
  background-size:cover; background-position:center 20%;
  border-bottom:1px solid var(--green-line-dim);
  overflow:hidden;
}
.hero::before{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(7,9,10,0.35) 0%, rgba(7,9,10,0.55) 45%, rgba(7,9,10,0.97) 92%);
}
.hero::after{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:0.5;
  background-image:
    radial-gradient(2px 2px at 15% 20%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1.5px 1.5px at 42% 12%, rgba(255,255,255,0.4), transparent),
    radial-gradient(2px 2px at 70% 30%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1.5px 1.5px at 85% 15%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1.5px 1.5px at 25% 45%, rgba(255,255,255,0.3), transparent);
  animation:drift 14s linear infinite;
}
@keyframes drift{ 0%{transform:translateY(0);} 100%{transform:translateY(24px);} }
.hero-inner{position:relative; z-index:2; padding:80px 0 46px 0; width:100%;}
.hero-title{font-size:clamp(2.1rem, 5.4vw, 4.1rem); line-height:1.05; margin:8px 0 18px 0; text-shadow:0 4px 30px rgba(0,0,0,0.6);}
.hero-title em{font-style:normal; color:var(--gold-bright);}
.hero-sub{max-width:620px; color:var(--parchment-dim); font-size:1.05rem; margin-bottom:26px;}
.hero-actions{display:flex; gap:14px; flex-wrap:wrap;}

.stat-strip{border-bottom:1px solid var(--green-line-dim); background:var(--void-2);}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--green-line-dim);}
.stat-item{background:var(--void-2); padding:22px 16px; text-align:center;}
.stat-num{font-family:var(--font-display); font-size:1.9rem; color:var(--gold-bright);}
.stat-label{font-family:var(--font-mono); font-size:0.62rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--steel); margin-top:4px;}
@media(max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

/* ============ SECTIONS ============ */
.section{padding:64px 0;}
.section-tight{padding:40px 0;}
.section-head{margin-bottom:34px; max-width:720px;}
.section-kicker{font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold); margin-bottom:10px;}
.section-title{font-size:clamp(1.5rem,3vw,2.1rem); margin-bottom:12px;}
.section-desc{color:var(--parchment-dim); font-size:1rem;}
hr.rule{border:none; border-top:1px solid var(--green-line-dim); margin:36px 0;}

/* ============ BULLETIN ============ */
.bulletin{
  background:var(--panel); border:1px solid var(--green-line-dim);
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
  overflow:hidden;
}
.bulletin-head{display:flex; gap:20px; padding:26px 28px; border-bottom:1px solid var(--green-line-dim); align-items:center; flex-wrap:wrap;}
.bulletin-cover{width:110px; flex-shrink:0; border:1px solid var(--green-line-dim);}
.bulletin-headtext{flex:1; min-width:220px;}
.bulletin-body{padding:30px 32px 12px 32px; font-size:1.02rem; color:var(--parchment-dim); max-width:760px;}
.bulletin-body p{margin-bottom:1.15em;}
.bulletin-body p:first-of-type::first-letter{
  font-family:var(--font-display); font-size:3.6em; float:left; line-height:0.8; padding:6px 10px 0 0; color:var(--gold-bright);
}
.bulletin-body blockquote{border-left:2px solid var(--gold); margin:0 0 1.2em 0; padding:2px 0 2px 18px; font-style:italic; color:var(--parchment);}
.bulletin-toggle{padding:18px 32px 30px 32px;}
.bulletin[data-collapsed="true"] .bulletin-full{display:none;}
.bulletin[data-collapsed="true"] .bulletin-fade{
  position:relative; margin-top:-70px; height:70px;
  background:linear-gradient(180deg, transparent, var(--panel));
}

/* ============ CARDS / STAMPS ============ */
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px;}
.card{
  background:var(--panel); border:1px solid var(--green-line-dim); position:relative;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  transition:border-color .15s;
}
.card:hover{border-color:var(--green-line);}
.nav-card{padding:22px 20px; text-decoration:none; display:block; cursor:pointer;}
.nav-card h3{font-size:1rem; margin-bottom:8px; color:var(--gold-bright);}
.nav-card p{color:var(--parchment-dim); font-size:0.9rem; margin:0;}

.dossier-card{cursor:pointer;}
.dossier-media{aspect-ratio:3/4; overflow:hidden; background:var(--void-2); border-bottom:1px solid var(--green-line-dim);}
.dossier-media img{width:100%; height:100%; object-fit:cover;}
.dossier-body{padding:14px 16px 16px 16px;}
.dossier-name{font-family:var(--font-display); font-size:1.02rem; margin-bottom:4px;}
.dossier-meta{font-family:var(--font-mono); font-size:0.66rem; letter-spacing:0.05em; color:var(--steel); text-transform:uppercase;}
.dossier-owner{margin-top:8px; font-size:0.8rem; color:var(--parchment-dim);}
.dossier-owner b{color:var(--gold-bright); font-weight:600;}

.stamp{
  position:absolute; top:14px; right:-4px; transform:rotate(-9deg);
  font-family:var(--font-mono); font-weight:700; font-size:0.62rem; letter-spacing:0.1em;
  padding:5px 10px; border:2px solid; border-radius:1px; text-transform:uppercase;
  background:rgba(7,9,10,0.72); pointer-events:none; z-index:2;
}
.stamp-approved{color:#7fce9c; border-color:#7fce9c;}
.stamp-pending{color:var(--gold-bright); border-color:var(--gold-bright);}
.stamp-denied{color:var(--scarlet-bright); border-color:var(--scarlet-bright);}
.stamp-classified{color:var(--steel); border-color:var(--steel);}

.badge{
  display:inline-block; font-family:var(--font-mono); font-size:0.62rem; letter-spacing:0.08em;
  text-transform:uppercase; padding:3px 8px; border:1px solid var(--green-line); color:var(--parchment-dim); border-radius:2px;
}

/* ============ TABS ============ */
.subtabs{display:flex; gap:8px; margin-bottom:30px; border-bottom:1px solid var(--green-line-dim); flex-wrap:wrap;}
.subtab{
  background:none; border:none; color:var(--steel); font-family:var(--font-mono); font-size:0.75rem;
  letter-spacing:0.08em; text-transform:uppercase; padding:12px 4px; cursor:pointer; position:relative; margin-right:22px;
}
.subtab::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:transparent;}
.subtab.active{color:var(--gold-bright);}
.subtab.active::after{background:var(--gold);}
.subtab:hover{color:var(--parchment);}

/* ============ FORMS ============ */
.form{max-width:640px;}
.field{margin-bottom:20px;}
.field label{display:block; font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--steel); margin-bottom:7px;}
.field .hint{font-size:0.78rem; color:var(--steel); margin-top:5px; font-family:var(--font-body);}
.field input[type=text], .field input[type=password], .field input[type=number], .field input[type=url], .field textarea, .field select{
  width:100%; background:var(--void-2); border:1px solid var(--green-line-dim); color:var(--parchment); padding:11px 13px; border-radius:var(--radius);
}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--gold); outline:none;}
.field textarea{min-height:120px; resize:vertical; font-family:var(--font-body);}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:560px){.form-row{grid-template-columns:1fr;}}
.form-actions{display:flex; gap:12px; margin-top:8px; flex-wrap:wrap;}
.form-error{background:rgba(143,42,42,0.18); border:1px solid var(--scarlet); color:#f0b3b3; padding:10px 14px; border-radius:var(--radius); font-size:0.86rem; margin-bottom:18px;}
.form-note{background:rgba(201,161,58,0.1); border:1px solid var(--green-line-dim); color:var(--parchment-dim); padding:14px 16px; border-radius:var(--radius); font-size:0.86rem; margin-bottom:20px;}

/* ============ LORE / CODEX ============ */
.lore-card, .codex-card{background:var(--panel); border:1px solid var(--green-line-dim); margin-bottom:14px;}
.lore-card summary, .codex-card summary{
  list-style:none; cursor:pointer; padding:18px 22px; display:flex; align-items:center; justify-content:space-between; gap:14px;
}
.lore-card summary::-webkit-details-marker, .codex-card summary::-webkit-details-marker{display:none;}
.lore-card summary .plus, .codex-card summary .plus{font-family:var(--font-mono); color:var(--gold); font-size:1.1rem; flex-shrink:0; transition:transform .15s;}
.lore-card[open] summary .plus{transform:rotate(45deg);}
.lore-title-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.lore-card summary h3{font-size:1.05rem;}
.lore-teaser{color:var(--steel); font-size:0.84rem; margin-top:3px;}
.lore-body, .codex-body{padding:0 22px 22px 22px; color:var(--parchment-dim); border-top:1px solid var(--green-line-dim); padding-top:16px;}

table.stat-table{width:100%; border-collapse:collapse; font-size:0.92rem; margin:16px 0;}
table.stat-table th, table.stat-table td{border:1px solid var(--green-line-dim); padding:10px 12px; text-align:left;}
table.stat-table th{font-family:var(--font-mono); font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--gold); background:var(--void-2);}
table.stat-table td b{color:var(--parchment);}
.formula-box{background:var(--void-2); border:1px solid var(--green-line-dim); padding:16px 18px; font-family:var(--font-mono); font-size:0.88rem; color:var(--gold-bright); margin:14px 0; line-height:1.9;}

/* ============ STORE ============ */
.store-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px;}
.store-item{padding:20px; display:flex; flex-direction:column; height:100%;}
.store-item h3{font-size:1.02rem; margin-bottom:8px; color:var(--gold-bright);}
.store-item p{font-size:0.88rem; color:var(--parchment-dim); flex:1;}
.store-price{font-family:var(--font-mono); font-size:1.15rem; color:var(--gold-bright); margin:10px 0 14px 0; display:flex; align-items:center; gap:6px;}

.earn-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px;}
.earn-card{padding:18px 20px;}
.earn-card h4{font-size:0.95rem; margin-bottom:6px; color:var(--parchment);}
.earn-card p{font-size:0.85rem; color:var(--steel); margin:0;}
.earn-amt{font-family:var(--font-mono); font-size:0.72rem; color:var(--gold); margin-top:8px; display:block;}

.ledger-table{width:100%; border-collapse:collapse; font-size:0.88rem;}
.ledger-table th, .ledger-table td{padding:10px 12px; border-bottom:1px solid var(--green-line-dim); text-align:left;}
.ledger-table th{font-family:var(--font-mono); font-size:0.65rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--steel);}
.ledger-pos{color:#7fce9c;}
.ledger-neg{color:var(--scarlet-bright);}

/* ============ MODALS / TOASTS ============ */
.modal-overlay{position:fixed; inset:0; background:rgba(5,6,6,0.82); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto;}
.modal{background:var(--panel); border:1px solid var(--gold); max-width:640px; width:100%; max-height:88vh; overflow-y:auto; position:relative; margin:auto;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--green-line-dim);}
.modal-body{padding:24px;}
.modal-close{background:none; border:none; color:var(--steel); font-size:1.3rem; cursor:pointer; line-height:1;}
.modal-close:hover{color:var(--gold-bright);}

.toast-region{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:10px; max-width:320px;}
.toast{background:var(--panel); border:1px solid var(--gold); padding:14px 18px; font-size:0.88rem; box-shadow:0 8px 30px rgba(0,0,0,0.5); animation:toastin .2s ease;}
.toast.error{border-color:var(--scarlet-bright);}
@keyframes toastin{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* ============ MISC ============ */
.pill-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px;}
.pill-input{background:var(--void-2); border:1px solid var(--green-line-dim); padding:9px 14px; border-radius:16px; color:var(--parchment); min-width:200px; flex:1;}
.pill-select{background:var(--void-2); border:1px solid var(--green-line-dim); padding:9px 14px; border-radius:16px; color:var(--parchment);}
.empty-state{border:1px dashed var(--green-line-dim); padding:50px 24px; text-align:center; color:var(--steel);}
.empty-state h3{color:var(--parchment-dim); margin-bottom:8px; font-size:1.05rem;}
.center-narrow{max-width:460px; margin:0 auto;}
.dim{color:var(--steel);}
.coin-icon{width:14px; height:14px; display:inline-block; vertical-align:-2px;}
.profile-strip{display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:0.72rem;}
.token-pill{background:var(--void-2); border:1px solid var(--gold); color:var(--gold-bright); padding:6px 11px; border-radius:14px; display:flex; align-items:center; gap:6px;}

footer.site-footer{border-top:1px solid var(--green-line-dim); padding:44px 0 60px 0; margin-top:20px;}
.footer-grid{display:grid; grid-template-columns:2fr 1fr 1fr; gap:36px;}
@media(max-width:700px){.footer-grid{grid-template-columns:1fr;}}
.footer-grid h4{font-size:0.78rem; font-family:var(--font-mono); letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); margin-bottom:14px;}
.footer-grid a{display:block; color:var(--parchment-dim); text-decoration:none; font-size:0.9rem; margin-bottom:9px;}
.footer-grid a:hover{color:var(--gold-bright);}
.footer-bottom{margin-top:40px; padding-top:20px; border-top:1px solid var(--green-line-dim); font-size:0.78rem; color:var(--steel); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}

.detail-grid{display:grid; grid-template-columns:160px 1fr; gap:22px;}
@media(max-width:520px){.detail-grid{grid-template-columns:1fr;}}
.detail-portrait{border:1px solid var(--green-line-dim);}
.detail-field{margin-bottom:16px;}
.detail-field .k{font-family:var(--font-mono); font-size:0.65rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); margin-bottom:5px;}
.detail-field .v{color:var(--parchment-dim); font-size:0.92rem; white-space:pre-wrap;}

.command-locked{max-width:420px; margin:70px auto; text-align:center;}
.admin-table{width:100%; border-collapse:collapse; font-size:0.88rem; margin-bottom:10px;}
.admin-table th, .admin-table td{padding:9px 10px; border-bottom:1px solid var(--green-line-dim); text-align:left; vertical-align:top;}
.admin-table th{font-family:var(--font-mono); font-size:0.62rem; text-transform:uppercase; color:var(--steel);}
.inline-actions{display:flex; gap:6px; flex-wrap:wrap;}

.checklist{display:flex; align-items:center; gap:8px; font-size:0.85rem; margin-bottom:6px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-region"></div>
<div class="toast-region" id="toast-region"></div>

<script>
/* =========================================================
   THE LATVERIAN REGISTRY — app.js
   Single-file SPA. Data persisted via window.storage.

async function loadJSON(key, shared, fallback){
  try{
    const r = await window.storage.get(key, shared);
    return r && r.value ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function saveJSON(key, shared, value){
  try{ await window.storage.set(key, JSON.stringify(value), shared); return true; }
  catch(e){ console.error("storage set failed", key, e); return false; }
}

/* ---------- utils ---------- */
function esc(s){
  return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function paragraphs(s){
  const clean = esc(s || "");
  if(!clean.trim()) return "<p class=\"dim\">— none on file —</p>";
  return clean.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
}
function fmtDate(iso){
  try{ return new Date(iso).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
  catch(e){ return iso || ""; }
}
function uid(prefix){ return prefix + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toast(msg, isError){
  const region = document.getElementById("toast-region");
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = msg;
  region.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 4200);
}
function q(sel, root){ return (root||document).querySelector(sel); }
function qa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }

/* ---------- data mutations ---------- */
async function persistAccounts(){ await saveJSON(KEYS.accounts, true, S.accounts); }
async function persistCharacters(){ await saveJSON(KEYS.characters, true, S.characters); }
async function persistAnnouncements(){ await saveJSON(KEYS.announcements, true, S.announcements); }
async function persistPurchases(){ await saveJSON(KEYS.purchases, true, S.purchases); }
async function persistInvites(){ await saveJSON(KEYS.invites, true, S.invites); }
async function persistPasscode(){ await saveJSON(KEYS.passcode, true, S.passcode); }

function addLedger(username, delta, reason){
  const acc = S.accounts[username];
  if(!acc) return;
  acc.tokens = (acc.tokens||0) + delta;
  if(!acc.ledger) acc.ledger = [];
  acc.ledger.unshift({ id: uid("ldg"), delta, reason, date: new Date().toISOString(), balance: acc.tokens });
  if(S.user && S.user.username === username) S.user = acc;
}

/* ---------- boot / load ---------- */
async function boot(){
  const [accounts, characters, announcements, purchases, invites, passcode, sessionUser] = await Promise.all([
    loadJSON(KEYS.accounts, true, {}),
    loadJSON(KEYS.characters, true, []),
    loadJSON(KEYS.announcements, true, null),
    loadJSON(KEYS.purchases, true, []),
    loadJSON(KEYS.invites, true, []),
    loadJSON(KEYS.passcode, true, null),
    loadJSON(KEYS.session, false, null)
  ]);
  S.accounts = accounts || {};
  S.characters = characters || [];
  S.purchases = purchases || [];
  S.invites = invites || [];
  if(announcements === null){
    S.announcements = [{
      id: uid("ann"),
      title: "The Registry Opens",
      body: "Filing is now open for canon and original dossiers. Read the Codex before you build a stat block, and remember: everything you file is reviewed by staff before it appears in the public Registry.",
      author: "The Latverian Registry",
      date: new Date().toISOString(),
      pinned: true
    }];
    await persistAnnouncements();
  } else {
    S.announcements = announcements;
  }
  if(passcode === null){
    S.passcode = "DOOMREIGNS26";
    await persistPasscode();
  } else {
    S.passcode = passcode;
  }
  if(sessionUser && S.accounts[sessionUser]){
    S.user = S.accounts[sessionUser];
  }
  S.loading = false;
  render();
}

function renderBulletin(){
  const bulletinHtml = `
    <p>The Scarlet Witch, Wanda Maximoff, looked after the pluripotent flowers in her garden. Five years have passed since Doom took control of the world. For these five years, she was left with nothing much to do.</p>
    <p>"I'm lucky that New Yorkers have no day that is not dull with the way things are in the world," stated Wanda with her fingers outstretched to disassemble badly made androids using magic. "Though, I must admit, given my history, I don't much enjoy dismantling these creations!" Wanda shouted above the whirring noise of angry automatons.</p>
    <p>Whoosh! A surge of scarlet energy erupted from her palms, weaving through the air like living ribbons. The rogue androids froze mid-leap, their joints locking as scarlet hexes rewrote their circuitry from the inside. One by one they collapsed into harmless scrap, the faint scent of ozone and scorched metal drifting through her garden.</p>
    <div class="bulletin-full">
    <p>Wanda brushed a stray lock of hair from her face and adjusted the Amulet of Power resting against her chest. The relic, an ancient, glowing artifact she had unearthed two years ago from a forgotten sanctum beneath the ruins of what was once the Sanctum Sanctorum, pulsed warmly against her skin. It amplified her spells while masking their chaotic signature from Doom's surveillance networks and the ever-watchful Darkholders. Without it, even minor workings like this would have drawn unwanted attention.</p>
    <p>She exhaled softly. Even after all this time, the peace still felt unnatural. No world-ending threats. No desperate battles to save reality itself. Just quiet days, blooming flowers that shouldn't exist, and the occasional malfunctioning drone sent by some overzealous Latverian maintenance unit.</p>
    <p>The world had changed dramatically in five years. Under Victor von Doom's rule, Earth had become United Latveria, one single nation. Borders dissolved. Wars vanished almost overnight. Hunger, crime, and disease were crushed to historic lows through advanced Latverian technology and strict governance. The Avengers had been restructured into Doom's Avengers, now serving as the empire's shield. The X-Men maintained a tense sovereignty on the living island of Krakoa. Even former enemies had found uneasy places in this new order.</p>
    <p>On paper, it was a golden age. In practice, it was control wrapped in the illusion of prosperity.</p>
    <p>Wanda knelt beside a cluster of flowers whose petals shimmered between realities, gently coaxing one back into stability with a whisper of chaos magic channeled through the Amulet. The artifact made the working smoother, quieter. "At least you're honest about being unstable," she murmured to the bloom.</p>
    <p>Her thoughts drifted as she worked. Thousands had vanished through off-world refugee routes, some willingly seeking new lives in distant colonies, others taken in silence. Ancient magical networks had been sealed by the Darkholders, cutting off entire ley lines and making true sorcery feel stifled. Whispers spoke of the Infinity Watch quietly reforming in secret, and questions lingered about what greater purpose Doom could possibly have beyond ruling the planet.</p>
    <p>The Amulet grew slightly warmer against her skin, almost as if in warning. She had learned to trust its instincts. She stood slowly, wiping dirt from her hands, the amulet's chain shifting under her fingers.</p>
    <p>"Something's coming," Wanda whispered to herself, eyes glowing faintly with residual power. "I can feel it in the threads. The world is too still… and Doom has never been one to enjoy stillness for long."</p>
    <p>As the sun dipped lower over the transformed skyline of New Latveria, once New York, the green and silver banners of the empire fluttered in the breeze. The city was orderly, efficient, and eerily calm. Wanda's garden remained one of the few pockets where raw magic still breathed freely, shielded by the Amulet's power.</p>
    <p>She glanced toward the towering embassy spires in the distance. A quiet life was what she had chosen after Doom's victory, but the Amulet had awakened old instincts. It didn't just hide her spells, it reminded her of who she truly was. The Scarlet Witch. And in a world this perfectly controlled, even the smallest disruption could unravel everything.</p>
    <p>Wanda touched the Amulet again, feeling its steady pulse. Whatever was stirring beneath the surface of the New World Order, she would face it on her own terms.</p>
    <blockquote>"I always manage to reshape the world, even without trying. Why not try, this time?" She smiled.</blockquote>
    </div>
  `;
  return `

function renderRegistryBrowse(){
  const approved = S.characters.filter(c => c.status === "approved");
  const factions = Array.from(new Set(approved.map(c => c.faction).filter(Boolean))).sort();

  const search = S.registrySearch.toLowerCase();
  let list = approved.filter(c => {
    if(search && !(c.name.toLowerCase().includes(search) || (c.faction||"").toLowerCase().includes(search))) return false;
    if(S.registryType !== "all" && c.type !== S.registryType) return false;
    if(S.registryFaction !== "all" && c.faction !== S.registryFaction) return false;
    return true;
  });

  const factionOptions = factions.map(f => `<option value="${esc(f)}" ${S.registryFaction===f?'selected':''}>${esc(f)}</option>`).join("");

  const grid = list.length ? `<div class="card-grid" id="registry-grid">${list.map(cardHtml).join("")}</div>` : `
    <div class="empty-state">
      <h3>No dossiers match yet.</h3>
      <p>Nothing on file fits that search. File a new dossier, or widen your filters.</p>
    </div>`;

  return `
    <div class="pill-row">
      <input class="pill-input" id="registry-search" placeholder="Search by name or faction…" value="${esc(S.registrySearch)}">
      <select class="pill-select" id="registry-type">
        <option value="all" ${S.registryType==='all'?'selected':''}>All Types</option>
        <option value="canon" ${S.registryType==='canon'?'selected':''}>Canon</option>
        <option value="oc" ${S.registryType==='oc'?'selected':''}>Original</option>
      </select>
      <select class="pill-select" id="registry-faction">
        <option value="all">All Factions</option>
        ${factionOptions}
      </select>
    </div>
    ${grid}
  `;
}

      </div>
    </details>

    <details class="codex-card">
      <summary><h3>Step 2 — Spend Your Points</h3><span class="plus">+</span></summary>
      <div class="codex-body">
        <p>Distribute your Rank's points across six stats. No stat can exceed your Rank's maximum.</p>
        <table class="stat-table">
          <tr><th>Stat</th><th>Governs</th></tr>
          <tr><td><b>M — Melee</b></td><td>Punching, lifting, brawling</td></tr>
          <tr><td><b>A — Agility</b></td><td>Speed, dodging, shooting, acrobatics</td></tr>
          <tr><td><b>R — Resilience</b></td><td>Health, toughness, taking hits</td></tr>

          <tr><td><b>E — Ego</b></td><td>Charisma, leadership, resisting mind control</td></tr>
          <tr><td><b>L — Logic</b></td><td>Intelligence, tech, reasoning</td></tr>
        </table>
      </div>
    </details>

    <details class="codex-card">
      <summary><h3>Step 3 — Derived Stats</h3><span class="plus">+</span></summary>
      <div class="codex-body">
        <p>These are calculated automatically from the stats above.</p>
        <div class="formula-box">
          Health = (Resilience × 10) + 20<br>
          Focus = (Vigilance × 10) + 20<br>
          <br>
          Melee Defense = 10 + Melee<br>
          Ranged Defense = 10 + Agility<br>

      </div>
    </details>

    <h3 style="margin-bottom:14px; font-size:1rem;">Exchequer Redemptions ${unfulfilled.length ? `<span class="badge" style="margin-left:6px;">${unfulfilled.length} waiting</span>` : ""}</h3>
    <p class="dim" style="font-size:0.86rem; margin-bottom:14px;">Members redeem Store items themselves — the token cost is deducted automatically. This queue is where you actually apply what they bought (adjust a stat, open a slot, apply a banner) and check it off.</p>
    <table class="admin-table"><tr><th>Member</th><th>Item</th><th>Cost</th><th>Date</th><th></th></tr>${purchaseRows}</table>

    <hr class="rule">

    <h3 style="margin-bottom:14px; font-size:1rem;">Grant Tokens</h3>
    <form class="form" data-form="grant-tokens">
      <div class="form-row">
        <div class="field"><label>Username</label><input type="text" name="username" required placeholder="without the @"></div>
        <div class="field"><label>Amount</label><input type="number" name="amount" required></div>
      </div>
      <div class="field"><label>Reason</label>
        <select name="reason">
          ${EARN_METHODS.map(m=>`<option>${esc(m.name)}</option>`).join("")}
          <option>Manual Adjustment</option>
        </select>
      </div>
      <button class="btn btn-primary" type="submit">Grant</button>
    </form>

    <hr class="rule">

    <h3 style="margin-bottom:14px; font-size:1rem;">Invite Tracker</h3>
    <form class="form" data-form="log-invite" style="margin-bottom:20px;">
      <div class="form-row">
        <div class="field"><label>Inviter Username</label><input type="text" name="inviter" required></div>
        <div class="field"><label>Invitee (Discord tag)</label><input type="text" name="invitee" required></div>
      </div>
      <button class="btn btn-sm" type="submit">Log Invite</button>
    </form>
    <table class="admin-table"><tr><th>Invite</th><th>Progress</th><th>Reward</th></tr>${inviteRows}</table>

    <hr class="rule">

    <h3 style="margin-bottom:14px; font-size:1rem;">Announcements</h3>
    <form class="form" data-form="post-announcement" style="margin-bottom:20px;">
      <div class="field"><label>Title</label><input type="text" name="title" required></div>
      <div class="field"><label>Body</label><textarea name="body" required></textarea></div>
      <div class="field"><label><input type="checkbox" name="pinned" style="width:auto; display:inline-block; margin-right:8px;">Pin to homepage</label></div>
      <button class="btn btn-sm" type="submit">Post Announcement</button>
    </form>
    <table class="admin-table"><tr><th>Title</th><th>Date</th><th></th></tr>${annRows}</table>

    <hr class="rule">

    <h3 style="margin-bottom:14px; font-size:1rem;">All Accounts</h3>
    <table class="admin-table"><tr><th>Username</th><th>Tokens</th><th>Joined</th></tr>${accountRows}</table>

    <hr class="rule">

    <h3 style="margin-bottom:14px; font-size:1rem;">Change Access Passcode</h3>
    <form class="form" data-form="change-passcode">
      <div class="field"><label>New Passcode</label><input type="text" name="passcode" required></div>
      <button class="btn btn-sm" type="submit">Update</button>
    </form>
  </div>`;
}

/* =========================================================
   AUTH MODAL
   ========================================================= */
let authMode = "login";
function renderAuthModal(){
  const isLogin = authMode === "login";
  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal" style="max-width:420px;">
      <div class="modal-head">
        <h3 style="font-size:1.1rem;">${isLogin?"Log In":"Create an Account"}</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <form class="form" data-form="${isLogin?'login':'register'}" style="max-width:none;">
          <div class="field"><label>Username</label><input type="text" name="username" required></div>
          <div class="field"><label>Password</label><input type="password" name="password" required></div>
          ${isLogin ? "" : `
          <div class="field"><label>Confirm Password</label><input type="password" name="confirm" required></div>
          <div class="field"><label>Discord Tag <span class="dim">(optional)</span></label><input type="text" name="discordTag" placeholder="username#0000 or @username"></div>
          `}
          <button class="btn btn-primary btn-block" type="submit">${isLogin?"Log In":"Register"}</button>
        </form>
        <p class="dim" style="margin-top:16px; font-size:0.84rem; text-align:center;">
          ${isLogin ? "Need an account?" : "Already registered?"}
          <a href="#" onclick="event.preventDefault(); openAuth('${isLogin ? "register" : "login"}');">${isLogin ? "Register here" : "Log in here"}</a>
        </p>
      </div>
    </div>
  </div>`;
}
function openAuth(mode){ authMode = mode || "login"; renderModal(renderAuthModal()); }

/* ---------- modal mount ---------- */
let activeModalCharId = null;
function renderModal(html){ document.getElementById("modal-region").innerHTML = html || ""; }
function closeModal(){ activeModalCharId = null; renderModal(""); }

/* =========================================================
   EVENT HANDLING
   ========================================================= */
document.addEventListener("DOMContentLoaded", () => {
  const app = document.getElementById("app");

  // Delegated on `document`, not `#app` — the login/register and character-detail
  // modals render into the sibling `#modal-region` div, so a listener scoped to
  // `#app` alone never sees clicks inside them.
  document.addEventListener("click", async (e) => {
    const t = e.target.closest("[data-action]");
    if(!t) return;
    const action = t.getAttribute("data-action");

    try{

    if(action === "set-tab"){
      S.tab = t.getAttribute("data-tab");
      window.scrollTo({top:0, behavior:"instant"});
      render();
    } else if(action === "set-dview"){
      S.dossierView = t.getAttribute("data-view");
      render();
    } else if(action === "set-exview"){
      S.exView = t.getAttribute("data-view");
      render();
    } else if(action === "open-auth"){
      openAuth("login");
    } else if(action === "logout"){
      S.user = null;
      await saveJSON(KEYS.session, false, null);
      toast("Logged out.");
      render();
    } else if(action === "toggle-bulletin"){
      const b = document.getElementById("bulletin");
      const collapsed = b.getAttribute("data-collapsed") === "true";
      b.setAttribute("data-collapsed", collapsed ? "false" : "true");
      t.textContent = collapsed ? "Show Less" : "Continue Reading";
    } else if(action === "view-character"){
      const id = t.getAttribute("data-id");
      const c = S.characters.find(x => x.id === id);
      if(c){ activeModalCharId = id; renderModal(characterDetailModal(c)); }
    } else if(action === "buy-item"){
      await handleBuy(t.getAttribute("data-id"));
    } else if(action === "approve-character"){
      await handleReview(t.getAttribute("data-id"), "approved");
    } else if(action === "deny-character"){
      const reason = prompt("Reason for denial (shown to the filer):") || "";
      await handleReview(t.getAttribute("data-id"), "denied", reason);
    } else if(action === "delete-announcement"){
      const id = t.getAttribute("data-id");
      S.announcements = S.announcements.filter(a => a.id !== id);
      await persistAnnouncements();
      render();
    } else if(action === "fulfill-purchase"){
      const p = S.purchases.find(x => x.id === t.getAttribute("data-id"));
      if(p){ p.redeemed = true; await persistPurchases(); toast("Marked fulfilled."); render(); }
    } else if(action === "toggle-invite-char"){
      const iv = S.invites.find(x => x.id === t.getAttribute("data-id"));
      if(iv){ iv.characterApproved = !iv.characterApproved; await persistInvites(); render(); }
    } else if(action === "invite-scene-inc"){
      const iv = S.invites.find(x => x.id === t.getAttribute("data-id"));
      if(iv && iv.scenesCompleted < 3){ iv.scenesCompleted++; await persistInvites(); render(); }
    } else if(action === "grant-invite-reward"){
      const iv = S.invites.find(x => x.id === t.getAttribute("data-id"));
      if(iv && S.accounts[iv.inviter]){
        addLedger(iv.inviter, 500, "Successful Invite — " + iv.invitee);
        iv.rewardGranted = true;
        await Promise.all([persistAccounts(), persistInvites()]);
        toast("Reward granted to @" + iv.inviter + ".");
        render();
      } else if(iv){
        toast("Inviter has no account on file.", true);
      }
    }

    }catch(err){
      console.error("Action failed:", action, err);
      toast("Something went wrong (" + action + "). Try again — if it keeps happening, reload.", true);
    }
  });

  // One submit listener for every form on the site, page content and modals alike.
  document.addEventListener("submit", async (e) => {
    const form = e.target.closest("form[data-form]");
    if(!form) return;
    e.preventDefault();
    const type = form.getAttribute("data-form");
    const data = Object.fromEntries(new FormData(form).entries());
    try{
      if(type === "canon") await submitCharacter("canon", data, form);
      else if(type === "oc") await submitCharacter("oc", data, form);
      else if(type === "grant-tokens") await handleGrantTokens(data, form);
      else if(type === "log-invite") await handleLogInvite(data, form);
      else if(type === "post-announcement") await handlePostAnnouncement(data, form);
      else if(type === "change-passcode") await handleChangePasscode(data, form);
      else if(type === "admin-login") await handleAdminLogin(data, form);
      else if(type === "login") await handleLogin(data, form);
      else if(type === "register") await handleRegister(data, form);
    }catch(err){
      console.error("Form submit failed:", type, err);
      formError(form, "Something went wrong on our end — nothing was saved. Try again.");
    }
  });

  document.addEventListener("input", (e) => {
    if(e.target.id === "registry-search"){
      S.registrySearch = e.target.value;
      refreshRegistryGrid();
    }
  });
  document.addEventListener("change", (e) => {
    if(e.target.id === "registry-type"){ S.registryType = e.target.value; refreshRegistryGrid(); }
    if(e.target.id === "registry-faction"){ S.registryFaction = e.target.value; refreshRegistryGrid(); }
  });

  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && document.getElementById("modal-region").innerHTML.trim() !== ""){
      closeModal();
    }
  });

  boot();
});

function refreshRegistryGrid(){
  const container = q(".wrap.section");
  if(!container) return;
  const gridWrap = qa(".card-grid, .empty-state", container).find(el => q("#registry-grid,.dossier-card", el) !== null || el.id === "registry-grid" || el.classList.contains("empty-state"));
  // simplest reliable approach: re-render whole dossiers view section body
  if(S.tab === "dossiers" && S.dossierView === "registry"){
    const secBody = document.querySelectorAll(".wrap.section")[0];
    // find the pill-row's parent and replace subsequent content
    const pillRow = q(".pill-row");
    if(pillRow && pillRow.parentElement){
      const holder = pillRow.parentElement;
      const html = renderRegistryBrowse();
      holder.innerHTML = html;
      const si = document.getElementById("registry-search");
      if(si){ si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
    }
  }
}

/* =========================================================
   ACTION IMPLEMENTATIONS
   ========================================================= */
async function handleRegister(data, form){
  const username = (data.username||"").trim();
  const password = data.password||"";
  const confirm = data.confirm||"";
  if(!username || username.length < 3){ formError(form, "Username needs at least 3 characters."); return; }
  if(S.accounts[username]){ formError(form, "That username is already registered."); return; }
  if(password.length < 4){ formError(form, "Password needs at least 4 characters."); return; }
  if(password !== confirm){ formError(form, "Passwords don't match."); return; }
  const acc = {
    username, password,
    discordTag: (data.discordTag||"").trim(),
    tokens: 100,
    joinDate: new Date().toISOString(),
    ledger: [{id:uid("ldg"), delta:100, reason:"Welcome grant", date:new Date().toISOString(), balance:100}]
  };
  S.accounts[username] = acc;
  S.user = acc;
  await persistAccounts();
  await saveJSON(KEYS.session, false, username);
  closeModal();
  toast("Welcome to the Registry, @" + username + ". 100 Doom Tokens granted.");
  render();
}
async function handleLogin(data, form){
  const username = (data.username||"").trim();
  const acc = S.accounts[username];
  if(!acc || acc.password !== data.password){ formError(form, "Username or password doesn't match our records."); return; }
  S.user = acc;
  await saveJSON(KEYS.session, false, username);
  closeModal();
  toast("Welcome back, @" + username + ".");
  render();
}
function formError(form, msg){
  let box = form.querySelector(".form-error");
  if(!box){
    box = document.createElement("div");
    box.className = "form-error";
    form.prepend(box);
  }
  box.textContent = msg;
}

async function submitCharacter(type, data, form){
  if(!S.user){ toast("Log in first.", true); return; }
  const base = {
    id: uid("chr"),
    type,
    name: (data.name||"").trim(),
    imageUrl: (data.imageUrl||"").trim(),
    owner: S.user.username,
    status: "pending",
    submittedAt: new Date().toISOString()
  };
  if(!base.name || !base.imageUrl){ formError(form, "Name and image URL are required."); return; }
  let record;
  if(type === "canon"){
    if(!data.rpSample || !data.rpSample.trim()){ formError(form, "An RP sample is required."); return; }
    record = { ...base, rpSample: data.rpSample.trim(), faction: "" };
  } else {
    const required = ["age","race","faction","powers","backstory"];
    for(const f of required){ if(!data[f] || !data[f].trim()){ formError(form, "Please fill in every required field."); return; } }
    record = { ...base, age:data.age.trim(), race:data.race.trim(), faction:data.faction.trim(), powers:data.powers.trim(), backstory:data.backstory.trim(), extra:(data.extra||"").trim() };
  }
  S.characters.unshift(record);
  await persistCharacters();
  toast("Dossier filed. It's pending staff review.");
  S.dossierView = "mine";
  render();
}

async function handleReview(id, status, note){
  const c = S.characters.find(x => x.id === id);
  if(!c) return;
  c.status = status;
  c.reviewedAt = new Date().toISOString();
  if(note) c.reviewNote = note;
  await persistCharacters();
  toast("Dossier " + (status === "approved" ? "approved." : "denied."));
  closeModal();
  render();
}

async function handleBuy(itemId){
  if(!S.user) return;
  const item = STORE_ITEMS.find(i => i.id === itemId);
  if(!item) return;
  if((S.user.tokens||0) < item.cost){ toast("Not enough Doom Tokens.", true); return; }
  addLedger(S.user.username, -item.cost, "Purchased: " + item.name);
  S.purchases.unshift({ id: uid("pur"), username: S.user.username, item: item.name, cost: item.cost, date: new Date().toISOString(), redeemed:false });
  await Promise.all([persistAccounts(), persistPurchases()]);
  toast(item.name + " purchased — filed in the Command Center's Redemption queue for staff to apply.");
  render();
}

async function handleGrantTokens(data, form){
  const username = (data.username||"").trim();
  const amount = parseInt(data.amount, 10);
  if(!S.accounts[username]){ formError(form, "No account with that username."); return; }
  if(!amount){ formError(form, "Enter a non-zero amount."); return; }
  addLedger(username, amount, data.reason || "Manual Adjustment");
  await persistAccounts();
  toast("Granted " + amount + " tokens to @" + username + ".");
  render();
}

async function handleLogInvite(data, form){
  const inviter = (data.inviter||"").trim();
  const invitee = (data.invitee||"").trim();
  if(!inviter || !invitee){ formError(form, "Both fields are required."); return; }
  S.invites.unshift({ id: uid("inv"), inviter, invitee, characterApproved:false, scenesCompleted:0, rewardGranted:false, date:new Date().toISOString() });
  await persistInvites();
  toast("Invite logged.");
  render();
}

async function handlePostAnnouncement(data, form){
  if(!data.title || !data.body){ formError(form, "Title and body are required."); return; }
  S.announcements.unshift({ id: uid("ann"), title:data.title.trim(), body:data.body.trim(), author:"Command Center", date:new Date().toISOString(), pinned: !!data.pinned });
  await persistAnnouncements();
  toast("Announcement posted.");
  render();
}

async function handleChangePasscode(data, form){
  if(!data.passcode || data.passcode.length < 4){ formError(form, "Passcode needs at least 4 characters."); return; }
  S.passcode = data.passcode;
  await persistPasscode();
  toast("Passcode updated.");
  render();
}

async function handleAdminLogin(data, form){
  if(data.passcode === S.passcode){
    S.isAdmin = true;
    toast("Command Center unlocked.");
    render();
  } else {
    formError(form, "Incorrect passcode.");
  }
}
</script>
</body>
</html>
